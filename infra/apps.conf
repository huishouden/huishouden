# Household apps in Firebase project huishouden-piekstra. Run: bun run bootstrap
# (pwa-kit's infra/bootstrap.sh). Add the app to ../apps.json and re-run to wire it.
PROJECT=huishouden-piekstra
DISPLAY_NAME=Huishouden
GITHUB_OWNER=huishouden
# Huishouden Tasks still lives under the user account until its session moves it.
ALSO_TRUSTED_OWNERS=piekstra
# Every app is listed once, in ../apps.json: the portal builds its tiles from it and this file
# derives the apps to provision (repo:hosting-site:Firebase web app name; empty name means no web
# app, so no sign-in). "provision": false skips an app another session wires itself.
APPS=()
while IFS= read -r app; do APPS+=("$app"); done < <(
  jq -r '.[] | select(.provision != false) | "\(.repo):\(.site):\(.webApp // "")"' "$(dirname "${BASH_SOURCE[0]}")/../apps.json"
)
