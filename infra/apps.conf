# Household apps in Firebase project huishouden-piekstra. Run: bun run bootstrap
# (pwa-kit's infra/bootstrap.sh). Add a repo here and re-run to wire a new app.
PROJECT=huishouden-piekstra
DISPLAY_NAME=Huishouden
GITHUB_OWNER=huishouden
# Huishouden Tasks still lives under the user account until its session moves it.
ALSO_TRUSTED_OWNERS=piekstra
# repo:hosting-site:Firebase web app name (empty: no web app, so no sign-in)
# Only repos this session owns; household-tasks wires itself.
APPS=(
  "portal:huishouden-piekstra:Portal"
  "spending:huishouden-spending:Spending"
  "baby:huishouden-baby:Baby"
)
