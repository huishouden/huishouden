# Reusable: scans the caller's full git history for secrets and personal data with gitleaks.
# Callers: jobs.<id>.uses: piekstra/huishouden/.github/workflows/leak-scan.yml@main
# Repo-specific allowlists go in the caller's .gitleaks.toml (extend this repo's base config).
name: leak-scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan history
        run: |
          config=()
          [ -f .gitleaks.toml ] && config=(--config .gitleaks.toml)
          gitleaks git . --redact --no-banner "${config[@]}"
