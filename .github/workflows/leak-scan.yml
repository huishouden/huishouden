# Reusable: scans the commits a PR or push adds for secrets and personal data with gitleaks.
# Only new commits: history predating the scan is audited once, when a repo is published.
# Callers: jobs.<id>.uses: piekstra/huishouden/.github/workflows/leak-scan.yml@main
# Repo-specific allowlists go in the caller's .gitleaks.toml (extend this repo's base config).
name: leak-scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          config=()
          [ -f .gitleaks.toml ] && config=(--config .gitleaks.toml)
          range=()
          # A first push or a manual run has no usable base; scan everything then.
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            range=(--log-opts "$BASE..$HEAD")
          fi
          gitleaks git . --redact --no-banner "${config[@]}" "${range[@]}"
